services:
  auth-wiedersehen-api:
    image: ghcr.io/letter-soup/auth-wiedersehen-api:latest
    build:
      context: ./
      dockerfile: ./Dockerfile.Api
    ports:
      - '5002:5002'
    depends_on:
      - auth-wiedersehen-db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://0.0.0.0:5002"
      AUTHW_ConnectionStrings__ApplicationDB: ${AW_APPLICATION_DB}
      AUTHW_ConnectionStrings__ConfigurationDB: ${AW_CONFIGURATION_DB}
      AUTHW_ConnectionStrings__PersistentGrandDB: ${AW_PERSISTENT_GRAND_DB}
      AUTHW_UI__LoginUrl: ${AW_UI_HOST}/sign-in
      AUTHW_UI__CookieLoginUrl: ${AW_UI_HOST}/cookie/sign-in

  auth-wiedersehen-seeder:
    image: ghcr.io/letter-soup/auth-wiedersehen-api:latest
    build:
      context: ./
      dockerfile: ./Dockerfile.Seeder
    depends_on:
      - auth-wiedersehen-db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AWSEED_ConnectionStrings__ApplicationDB: ${AW_APPLICATION_DB}
      AWSEED_ConnectionStrings__ConfigurationDB: ${AW_CONFIGURATION_DB}
      AWSEED_ConnectionStrings__PersistentGrandDB: ${AW_PERSISTENT_GRAND_DB}

  auth-wiedersehen-db:
    image: postgres:17-alpine
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${DB_ADMIN_PWD}
    ports:
      - '5432:5432'
    volumes:
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 134217728 # 128*2^20 bytes = 128Mb

  auth-wiedersehen-admin:
    build:
      context: ./
      dockerfile: ./Dockerfile.Admin
    ports:
      - '5003:5003'
    depends_on:
      - auth-wiedersehen-db
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://0.0.0.0:5003"
      AWA_ConnectionStrings__ConfigurationDB: ${AW_CONFIGURATION_DB}
      AWA_ConnectionStrings__ManagerDB: ${AWA_MANAGER_DB}
      AWA_Jwt__SigningKey: ${AWA_JWT_SIGNING_KEY}
      AWA_Admin__Username: ${AWA_ADMIN_USERNAME}
      AWA_Admin__Password: ${AWA_ADMIN_PASSWORD}

  auth-wiedersehen-web:
    image: ghcr.io/letter-soup/auth-wiedersehen-web:latest
    build:
      context: ./
      dockerfile: ./Dockerfile.Web
      tags:
        - auth-wiedersehen-web:latest
    depends_on:
      - auth-wiedersehen-api
    restart: on-failure:3
    ports:
      - '8080:80'
    environment:
      AW_API_URI: ${AW_API_URI}
      AW_CLIENT_ID: ${AW_CLIENT_ID}
      AW_REDIRECT_URI: ${AW_REDIRECT_URI}
